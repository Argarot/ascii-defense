<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tile Smith — ASCII Defense</title>
    <meta name="description" content="Author terrain tiles with the game's own legality rules baked in" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #07090c;
        color: #cfd6e4;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 14px;
      }
      body { display: flex; justify-content: center; padding: 18px 8px; }
      /* Two FIXED columns (playtest 12, item 10): a long verdict line or a
         widening widget must never reflow the other half of the screen. */
      #app { display: grid; grid-template-columns: 440px 460px; gap: 28px; align-items: start; }
      #app .col { min-width: 0; }
      #app .col * { overflow-wrap: break-word; }
      h1 { font-size: 16px; color: #2ee6a0; margin: 0 0 4px; }
      .sub { color: #5c6b7f; font-size: 12px; margin-bottom: 14px; }
      .col { display: flex; flex-direction: column; gap: 12px; }
      .grid { display: grid; grid-template-columns: repeat(5, 44px); gap: 3px; }
      .grid button {
        width: 44px; height: 44px; border: 1px solid #1c2530; cursor: pointer;
        font: inherit; font-size: 16px; color: #cfd6e4;
      }
      .grid button:hover { outline: 2px solid #2ee6a0; }
      .palette { display: flex; gap: 8px; align-items: stretch; }
      .pal-labels { display: flex; flex-direction: column; }
      .pal-labels div {
        display: flex; align-items: center; justify-content: flex-end;
        width: 58px; padding-right: 4px; color: #5c6b7f; font-size: 12px;
        letter-spacing: 0.5px;
      }
      .pal-grid { display: grid; grid-template-columns: repeat(4, 46px); gap: 4px; }
      .pal-grid .brush {
        width: 46px; height: 46px; cursor: pointer; padding: 0;
        border: 1px solid #1c2530; background: #0c1017; color: #cfd6e4;
        font: inherit; display: flex; align-items: center; justify-content: center;
      }
      .pal-grid .brush .glyph { font-size: 22px; line-height: 22px; }
      .pal-grid .brush:hover { outline: 2px solid #1f6f43; }
      .pal-grid .brush.active { outline: 2px solid #2ee6a0; }
      .verdict-ok { color: #2ee6a0; }
      .verdict-bad { color: #ff9090; }
      ul { margin: 4px 0; padding-left: 18px; color: #ff9090; font-size: 12px; }
      .conn { color: #5c6b7f; font-size: 12px; }
      .conn b { color: #c2d6ea; }
      label { font-size: 12px; color: #5c6b7f; display: block; }
      input, select {
        font: inherit; background: #0c1017; color: #cfd6e4;
        border: 1px solid #1c2530; padding: 4px 6px; width: 220px;
      }
      .actions { display: flex; gap: 8px; }
      .actions button {
        font: inherit; padding: 6px 12px; cursor: pointer;
        border: 1px solid #1c2530; background: #0c1017; color: #cfd6e4;
      }
      .actions button:disabled { opacity: 0.35; cursor: not-allowed; }
      pre {
        background: #0c1017; border: 1px solid #1c2530; padding: 8px;
        font-size: 11px; max-width: 420px; overflow-x: auto;
      }
      canvas { border: 1px solid #1c2530; image-rendering: pixelated; display: block; }
      a { color: #4cc9f0; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/tilesmith.ts"></script>
  </body>
</html>
