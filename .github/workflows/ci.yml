name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a force-push obsoletes the previous run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (CONTRIBUTING invariants 1-3)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (node)
        run: npx vitest run --project node

      # Playwright headless Chromium; WebGL2 arrives via SwiftShader software
      # rendering on the runner. The render tests are the canary for that path.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (render, WebGL2)
        run: npx vitest run --project browser

      # Proves the production bundle still assembles; Pages deploys only from
      # main via pages.yml, so this is a check, not a deployment.
      - name: Build
        run: npm run build

      # Session 2 of Phase 1 adds here: browser-mode/snapshot tests (WBS
      # 1.1.6-1.1.7) and content schema validation (WBS 1.1.8).
