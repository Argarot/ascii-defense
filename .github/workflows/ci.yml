name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a force-push obsoletes the previous run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (CONTRIBUTING invariants 1-3)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Proves the production bundle still assembles; Pages deploys only from
      # main via pages.yml, so this is a check, not a deployment.
      - name: Build
        run: npm run build

      # Session 2 of Phase 1 adds here: browser-mode/snapshot tests (WBS
      # 1.1.6-1.1.7) and content schema validation (WBS 1.1.8).
