name: CI

# Runs on every pull request, and is CALLED by pages.yml before a deploy (issue
# #212): main used to deploy without running a single test, because the two
# workflows were siblings on the same push and Pages waited for nobody. The
# push-to-main trigger moved there with it - one run of the checks on main,
# and the deploy hangs off its result.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a force-push obsoletes the previous run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (CONTRIBUTING invariants 1-3)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (node)
        run: npx vitest run --project node

      # Playwright headless Chromium; WebGL2 arrives via SwiftShader software
      # rendering on the runner. The render tests are the canary for that path.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (render, WebGL2)
        run: npx vitest run --project browser

      - name: Content validation and linter
        run: node tools/validate-content.mjs

      # The catalogue (docs/CATALOGUE.md) is rendered from content; a stale copy fails.
      - name: Catalogue drift check
        run: node tools/codex.mjs --check

      # The docs reference each other; the seams that drifted before are held (tools/doc-drift.mjs).
      - name: Doc drift check
        run: node tools/doc-drift.mjs

      # Generated types must match the schemas in the same commit. Regenerate
      # and fail on any diff - committed types can never drift.
      - name: Content type drift check
        run: |
          node tools/build-content-types.mjs
          git diff --exit-code packages/content/src/generated

      # Proves the production bundle still assembles; Pages deploys only from
      # main via pages.yml, so this is a check, not a deployment.
      - name: Build
        run: npm run build
