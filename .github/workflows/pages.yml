name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions for the Pages deployment. Deliberately minimal:
# the job reads the repo and writes a Pages deployment, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. Queue rather than cancel, so a push that
# lands mid-deploy still ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      # Note: enabling the Pages *site* cannot be automated. Neither GITHUB_TOKEN
      # nor a repo-scoped fine-grained PAT may call the create-site endpoint, so
      # `enablement: true` fails with "Resource not accessible by integration".
      # A fork must set Settings > Pages > Source to "GitHub Actions" by hand once.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
