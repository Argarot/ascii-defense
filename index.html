<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Defense</title>
    <meta name="description" content="Roguelite tower defense rendered entirely in ASCII" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #07090c;
        color: #cfd6e4;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 12px;
      }
      #app { display: inline-block; }
      canvas {
        display: block;
        border: 1px solid #1c2530;
        border-radius: 3px;
        max-width: 100%;
      }
      .hud {
        margin-top: 10px;
        font-size: 12px;
        color: #5c6b7f;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
